user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format combined_with_limit '$remote_addr - $remote_user [$time_local] "$request" '
                                   '$status $body_bytes_sent "$http_referer" '
                                   '"$http_user_agent" '
                                   'limit_req_status=$limit_req_status';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 1m;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Rate limiting zones
    # Zone: general - 10 requests per second per IP (burst 20)
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

    # Zone: api - 5 requests per second per IP (burst 10)
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

    # Zone: url_create - 2 requests per second per IP (burst 5)
    limit_req_zone $binary_remote_addr zone=url_create:10m rate=2r/s;

    # Connection limiting - max 10 concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Rate limit status code
    limit_req_status 429;
    limit_conn_status 429;

    # Upstream application server
    upstream shortly_backend {
        server app:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Include virtual host configs
    include /etc/nginx/conf.d/*.conf;
}
