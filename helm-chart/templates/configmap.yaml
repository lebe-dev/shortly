apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helm-chart.fullname" . }}
  labels:
    {{- include "helm-chart.labels" . | nindent 4 }}
data:
  {{- if .Values.config.nginx.enabled }}
  BIND: {{ printf "0.0.0.0:%d" (int .Values.config.nginx.backendPort) | quote }}
  {{- else }}
  BIND: {{ .Values.config.bind | quote }}
  {{- end }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOG_TARGET: {{ .Values.config.logTarget | quote }}
  BASE_URL: {{ .Values.config.baseUrl | quote }}
  SHORT_URL_TTL: {{ .Values.config.shortUrl.ttl | quote }}
  SHORT_URL_MAX_LENGTH: {{ .Values.config.shortUrl.maxLength | quote }}
  SCHEDULER_CLEANUP_EXPIRED_URLS: {{ .Values.config.scheduler.cleanupExpiredUrls | quote }}
  FEATURES_CREATE_URL_ENABLED: {{ .Values.config.features.createUrl.enabled | quote }}
  FEATURES_CREATE_URL_AUTH_ONLY: {{ .Values.config.features.createUrl.authOnly | quote }}
  FEATURES_CREATE_URL_MAX_PER_USER: {{ .Values.config.features.createUrl.maxPerUser | quote }}
  FEATURES_CREATE_URL_MAX_PER_DAY: {{ .Values.config.features.createUrl.maxPerDay | quote }}
  FEATURES_NAMED_URLS_ENABLED: {{ .Values.config.features.namedUrls.enabled | quote }}
  FEATURES_NAMED_URLS_MIN_LENGTH: {{ .Values.config.features.namedUrls.minLength | quote }}
  FEATURES_NAMED_URLS_MAX_LENGTH: {{ .Values.config.features.namedUrls.maxLength | quote }}
  AUTH_ENABLED: {{ .Values.config.auth.enabled | quote }}
  AUTH_TYPE: {{ .Values.config.auth.type | quote }}
  {{- if .Values.config.auth.note }}
  AUTH_NOTE: {{ .Values.config.auth.note | quote }}
  {{- end }}
  {{- if .Values.config.auth.adminUsers }}
  AUTH_ADMIN_USERS: {{ .Values.config.auth.adminUsers | quote }}
  {{- end }}
  AUTH_PROVIDERS_GITLAB_BASE_URL: {{ .Values.config.auth.providers.gitlab.baseUrl | quote }}
  PASSKEY_ENABLED: {{ .Values.config.auth.passkey.enabled | quote }}
  {{- if .Values.config.auth.passkey.enabled }}
  PASSKEY_RP_ID: {{ required "config.auth.passkey.rpId is required when passkeys are enabled" .Values.config.auth.passkey.rpId | quote }}
  PASSKEY_RP_ORIGIN: {{ required "config.auth.passkey.rpOrigin is required when passkeys are enabled" .Values.config.auth.passkey.rpOrigin | quote }}
  PASSKEY_RP_NAME: {{ .Values.config.auth.passkey.rpName | quote }}
  PASSKEY_CHALLENGE_TTL: {{ .Values.config.auth.passkey.challengeTtl | quote }}
  {{- end }}
  METRICS_ENABLED: {{ .Values.config.metrics.enabled | quote }}
{{- if .Values.config.nginx.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helm-chart.fullname" . }}-nginx
  labels:
    {{- include "helm-chart.labels" . | nindent 4 }}
data:
  nginx.conf: |
{{ .Values.config.nginx.config | indent 4 }}
{{- end }}
