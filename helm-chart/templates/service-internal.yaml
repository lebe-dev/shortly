{{- if .Values.config.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm-chart.fullname" . }}-internal
  labels:
    {{- include "helm-chart.labels" . | nindent 4 }}
  annotations:
    # Internal service for Prometheus metrics scraping
    # Bypasses nginx sidecar, connects directly to Shortly app
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: backend
      protocol: TCP
      name: metrics
  selector:
    {{- include "helm-chart.selectorLabels" . | nindent 4 }}
{{- end }}
