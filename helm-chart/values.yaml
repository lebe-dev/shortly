# Default values for helm-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: tinyops/shortly
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true

securityContext:
  runAsUser: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations:
    # Cache static assets (nginx ingress controller only)
    nginx.ingress.kubernetes.io/configuration-snippet: |
      location ~* \.(?:jpg|jpeg|gif|png|ico|js|svg|woff|woff2|ttf|css)$ {
        expires max;
        access_log off;
        add_header Cache-Control "public";
      }
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
    - name: gateway
      sectionName: http
      # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
    - chart-example.local
  # List of rules and filters applied.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Persistent storage for SQLite database
persistence:
  enabled: true
  # Existing claim to use (if not specified, a new PVC will be created)
  existingClaim: ""
  # Storage class name (use "-" for default storage class)
  storageClass: ""
  # Access modes for the volume
  accessModes:
    - ReadWriteOnce
  # Size of the volume
  size: 1Gi
  # Annotations for the PVC
  annotations: {}
  # Selector to match an existing PV
  selector: {}
  # Path where the volume will be mounted in the container
  mountPath: /data
  # Subpath within the volume (optional)
  subPath: ""

# Application configuration
config:
  # Server bind address (host:port)
  bind: "0.0.0.0:8080"
  # Logging level: debug, info, warn, error
  logLevel: "info"
  # Logging target: console, file, stdout
  logTarget: "stdout"
  # Base URL for generating short links (e.g., https://shortly.company.com)
  baseUrl: "http://localhost:8080"

  # Short URL generation settings
  shortUrl:
    # Link time-to-live in hours (default: 168 = 7 days)
    ttl: 168
    # Maximum allowed URL length in characters
    maxLength: 2048

  # Scheduled tasks configuration
  scheduler:
    # Cron expression for cleaning up expired URLs (format: "sec min hour day-of-month month day-of-week")
    # Default: "0 0 * * * *" runs every hour at minute 0
    cleanupExpiredUrls: "0 0 * * * *"

  # Feature flags for application functionality
  features:
    createUrl:
      # Enable/disable URL creation endpoint
      enabled: true
      # Require authentication to create URLs
      authOnly: true
      # Maximum URLs per user (applies to all URL types)
      maxPerUser: 100
      # Maximum URLs per day (applies to all URL types)
      maxPerDay: 10

    namedUrls:
      # Enable/disable custom named URLs feature
      enabled: false
      # Minimum length for custom URL names
      minLength: 3
      # Maximum length for custom URL names
      maxLength: 50

  # Authentication configuration
  auth:
    # Enable/disable authentication
    enabled: true
    # Authentication provider type (supported: gitlab)
    type: "gitlab"
    # Optional note to display on login page (e.g., "VPN must be enabled")
    note: ""

    # Authentication provider settings
    providers:
      gitlab:
        # GitLab instance base URL
        baseUrl: "https://gitlab.com"

  # Nginx reverse proxy configuration
  nginx:
    # Enable/disable nginx sidecar (default: true)
    enabled: true

    # Nginx image configuration
    image:
      repository: nginxinc/nginx-unprivileged
      tag: 1.29.3-alpine-otel
      pullPolicy: IfNotPresent

    # Nginx container port (internal)
    port: 8080

    # Backend application port (where Shortly app will listen)
    backendPort: 8081

    # Resource limits for nginx container
    resources: {}
      # limits:
      #   cpu: 100m
      #   memory: 64Mi
      # requests:
      #   cpu: 50m
      #   memory: 32Mi

    # Nginx configuration (will be mounted as nginx.conf)
    config: |
      worker_processes auto;
      error_log /dev/stderr warn;
      pid /tmp/nginx.pid;

      events {
          worker_connections 1024;
      }

      http {
          include /etc/nginx/mime.types;
          default_type application/octet-stream;

          log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

          access_log /dev/stdout main;

          sendfile on;
          tcp_nopush on;
          tcp_nodelay on;
          keepalive_timeout 65;
          types_hash_max_size 4096;
          client_max_body_size 10m;

          # Gzip compression (optimal level)
          gzip on;
          gzip_vary on;
          gzip_proxied any;
          gzip_comp_level 6;
          gzip_types text/plain text/css text/xml text/javascript
                     application/json application/javascript application/xml+rss
                     application/rss+xml font/truetype font/opentype
                     application/vnd.ms-fontobject image/svg+xml;
          gzip_disable "msie6";

          # Temp paths for unprivileged nginx
          client_body_temp_path /tmp/client_temp;
          proxy_temp_path /tmp/proxy_temp;
          fastcgi_temp_path /tmp/fastcgi_temp;
          uwsgi_temp_path /tmp/uwsgi_temp;
          scgi_temp_path /tmp/scgi_temp;

          upstream backend {
              server localhost:8081;
          }

          server {
              listen 8080;
              server_name _;

              # SvelteKit immutable assets - aggressive caching
              location ~* /_app/immutable/.*\.(js|css|woff|woff2|ttf|svg)$ {
                  proxy_pass http://backend;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  expires max;
                  access_log off;
                  add_header Cache-Control "public, immutable";
              }

              # Other static assets - moderate caching
              location ~* \.(jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf)$ {
                  proxy_pass http://backend;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  expires 7d;
                  access_log off;
                  add_header Cache-Control "public";
              }

              # Default proxy for all other requests
              location / {
                  proxy_pass http://backend;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header Connection "";
                  proxy_http_version 1.1;
              }
          }
      }

secrets:
  annotations: {}
  # vault.security.banzaicloud.io/vault-addr: https://vault.company.com
  # vault.security.banzaicloud.io/vault-role: shortly
  # vault.security.banzaicloud.io/vault-path: kubernetes_internal

  # Database connection string
  dbCnn: "sqlite:///data/shortly.db?mode=rwc"

  auth:
    providers:
      gitlab:
        applicationId: ""
        #applicationId: "vault:secret_v2/data/infra/shortly#APPLICATION_ID"
        secret: ""
        #secret: "vault:secret_v2/data/infra/shortly#SECRET"
