[package]
name = "webapp"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'

[[bin]]
name = "server"
path = "src/bin/server/main.rs"

[lib]
name = "server_lib"
path = "src/lib/lib.rs"

[dependencies]
anyhow = "1.0.98"
thiserror = { version = "2.0.12" }

config = { version = "0.15.11", features = ["yaml"] }

axum = { version = "0.8.4", features = ["json", "http1", "tokio"] }
axum-extra = { version = "0.9.4", features = ["cookie"] }
time = { version = "0.3" }
rust-embed = { version = "8.7.2" }
mime_guess = { version = "2.0.5" }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite"] }

tokio = { version = "1.45.1", features = ["full"] }

serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140" }

log = "0.4.27"
log4rs = "1.3.0"

[dev-dependencies]
env_logger = "0.11.8"
tempfile = "3.8.1"
