[package]
name = "shortly"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'

[[bin]]
name = "server"
path = "src/bin/server/main.rs"

[lib]
name = "server_lib"
path = "src/lib/lib.rs"

[dependencies]
anyhow = "1.0.100"
thiserror = { version = "2.0.17" }

config = { version = "0.15.19", features = ["yaml"] }

axum = { version = "0.8.7", features = ["json", "http1", "tokio"] }
axum-extra = { version = "0.12.2", features = ["cookie"] }
time = { version = "0.3.44" }
rust-embed = { version = "8.9.0" }
mime_guess = { version = "2.0.5" }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite"] }

tokio = { version = "1.48.0", features = ["full"] }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145" }

log = "0.4.28"
log4rs = "1.4.0"

[dev-dependencies]
env_logger = "0.11.8"
tempfile = "3.23.0"
